name: Temporary JED-DTW fare sweep

on:
  push:
    branches:
      - tmp/jed-dtw-fares-20261012
    paths:
      - .github/workflows/jed-dtw-sweep.yml
      - scripts/jed_dtw_sweep.py

permissions:
  contents: write

concurrency:
  group: temporary-jed-dtw-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install search dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/kftang/fast-flights.git' requests pycryptodome playwright
          python -m playwright install --with-deps chromium

      - name: Search two independent date batches
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/jed_dtw_sweep.py

      - name: Print compact table
        if: always()
        run: |
          if [ -f results/jed_dtw_skyteam_2026-12-25_to_2027-01-05.md ]; then
            sed -n '1,40p' results/jed_dtw_skyteam_2026-12-25_to_2027-01-05.md
          fi

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jed-dtw-sweep-results
          path: results/
          if-no-files-found: warn
          retention-days: 3

      - name: Commit checkpoint and results to temporary branch
        if: always()
        run: |
          if [ ! -d results ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Store temporary JED-DTW sweep results'
            git push origin HEAD:tmp/jed-dtw-fares-20261012
          fi
