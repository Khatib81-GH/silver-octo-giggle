name: Temporary JED-DTW cash and award scan

on:
  push:
    branches:
      - tmp/jed-dtw-fares-20261012
    paths:
      - .github/workflows/tmp-jed-dtw-fares.yml

permissions:
  contents: read

jobs:
  pointsyeah-awards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PointsYeah client
        run: |
          git clone --depth=1 https://github.com/farzanariel/pointsyeah-api.git /tmp/pointsyeah-api
          cd /tmp/pointsyeah-api
          npm ci
      - name: Search all dates in one award task
        continue-on-error: true
        run: /tmp/pointsyeah-api/node_modules/.bin/tsx scripts/tmp_pointsyeah_scan.ts
      - name: Show compact result
        if: always()
        run: cat tmp_pointsyeah_programs.json 2>/dev/null || true
      - name: Upload award source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jed-dtw-pointsyeah-20261225-20270105
          path: |
            tmp_pointsyeah_results.json
            tmp_pointsyeah_programs.json
            tmp_pointsyeah_progress.json
          if-no-files-found: warn
          retention-days: 1

  google-cash:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google Flights client
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m pip install 'git+https://github.com/kftang/fast-flights.git'
          python -m playwright install --with-deps chromium
      - name: Search each date and preserve each completed result
        continue-on-error: true
        run: python scripts/tmp_google_cash_scan.py
      - name: Upload cash source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jed-dtw-google-cash-20261225-20270105
          path: tmp_google_cash_results.json
          if-no-files-found: warn
          retention-days: 1
