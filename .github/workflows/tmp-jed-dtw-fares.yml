name: Temporary JED-DTW cash and award scan

on:
  push:
    branches:
      - tmp/jed-dtw-fares-20261012
    paths:
      - .github/workflows/tmp-jed-dtw-fares.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out scratch branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install search clients
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'mcp>=1.12,<2' fast-flights playwright
          python -m playwright install --with-deps chromium

      - name: Search cash and awards without restarting completed sources
        continue-on-error: true
        run: python scripts/tmp_jed_dtw_scan.py

      - name: Show result files
        if: always()
        run: |
          echo '--- Markdown summary ---'
          cat tmp_jed_dtw_results.md 2>/dev/null || true
          echo '--- JSON size ---'
          wc -c tmp_jed_dtw_results.json 2>/dev/null || true

      - name: Upload complete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jed-dtw-cash-awards-20261225-20270105
          path: |
            tmp_jed_dtw_results.json
            tmp_jed_dtw_results.md
          if-no-files-found: warn
          retention-days: 1
