name: Temporary JED-DTW fare sweep

on:
  push:
    branches:
      - tmp/jed-dtw-search-20261012

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install search dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests fast-flights selectolax
      - name: Run exact AwardTravelFinder daily sweep
        continue-on-error: true
        run: python tmp_search/atf_daily.py
      - name: Run defensive Google Flights cash sweep
        continue-on-error: true
        run: python tmp_search/cash_raw.py
      - name: Package diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          names=['atf_daily_results.json','atf_daily_registration.json','cash_raw_results.json']
          files={}
          for name in names:
              p=pathlib.Path(name)
              files[name]={'exists':p.exists(),'size':p.stat().st_size if p.exists() else None}
          pathlib.Path('manifest.json').write_text(json.dumps(files,indent=2))
          print(json.dumps(files,indent=2))
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jed-dtw-focused-results
          path: |
            manifest.json
            atf_daily_results.json
            atf_daily_registration.json
            cash_raw_results.json
          if-no-files-found: warn
          retention-days: 1
