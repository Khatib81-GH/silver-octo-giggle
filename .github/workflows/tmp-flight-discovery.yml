name: Temporary JED-DTW cash and award sweep

on:
  push:
    branches:
      - tmp-flight-search-20261012

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/farzanariel/pointsyeah-api.git /tmp/pointsyeah
          cd /tmp/pointsyeah
          npm install --silent
          python3 -m pip install --upgrade pip >/dev/null
          python3 -m pip install 'git+https://github.com/kftang/fast-flights.git' >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/results"

      - name: Search PointsYeah awards for entire date range
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/pointsyeah/run-jed-dtw.ts <<'TS'
          import { search } from "./src/pointsyeah.ts";
          import { writeFileSync } from "node:fs";

          const startedAt = new Date().toISOString();
          try {
            const results = await search(
              {
                departure: "JED",
                arrival: "DTW",
                departDate: "2026-12-25",
                departDateTo: "2027-01-05",
                cabins: ["Economy"],
                adults: 1,
                children: 0,
              },
              {
                timeoutMs: 240_000,
                pollIntervalMs: 100,
              },
            );

            const wanted = results.filter((r) => {
              const label = `${r.program ?? ""} ${r.code ?? ""}`.toLowerCase();
              return /flying\s*blue|air\s*france|klm|delta|skymiles/.test(label);
            });
            const output = {
              source: "PointsYeah live award search",
              searched_at_utc: startedAt,
              completed_at_utc: new Date().toISOString(),
              query: {
                origin: "JED",
                destination: "DTW",
                start_date: "2026-12-25",
                end_date: "2027-01-05",
                cabin: "Economy",
              },
              programs_seen: [...new Set(results.map((r) => `${r.program} [${r.code}]`))].sort(),
              all_program_result_count: results.length,
              wanted,
            };
            writeFileSync(`${process.env.GITHUB_WORKSPACE}/results/pointsyeah.json`, JSON.stringify(output, null, 2));
            console.log(`POINTSYEAH_OK programs=${output.programs_seen.length} wanted_groups=${wanted.length}`);
            console.log(`PROGRAMS_SEEN ${JSON.stringify(output.programs_seen)}`);
          } catch (error) {
            const output = {
              source: "PointsYeah live award search",
              searched_at_utc: startedAt,
              completed_at_utc: new Date().toISOString(),
              error: error instanceof Error ? `${error.name}: ${error.message}` : String(error),
            };
            writeFileSync(`${process.env.GITHUB_WORKSPACE}/results/pointsyeah.json`, JSON.stringify(output, null, 2));
            console.log(`POINTSYEAH_ERROR ${output.error}`);
          }
          TS
          cd /tmp/pointsyeah
          npx tsx run-jed-dtw.ts

      - name: Search Google Flights cash fares date by date
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import dataclasses
          import datetime as dt
          import json
          import re
          import time
          from pathlib import Path

          from fast_flights import FlightData, Passengers, get_flights

          start = dt.date(2026, 12, 25)
          end = dt.date(2027, 1, 5)
          dates = []
          d = start
          while d <= end:
              dates.append(d.isoformat())
              d += dt.timedelta(days=1)

          started_at = dt.datetime.now(dt.timezone.utc).isoformat()
          output = {
              "source": "Google Flights via fast-flights",
              "searched_at_utc": started_at,
              "query": {
                  "origin": "JED",
                  "destination": "DTW",
                  "start_date": dates[0],
                  "end_date": dates[-1],
                  "cabin": "Economy",
                  "trip": "one-way",
                  "max_stops": 2,
              },
              "dates": {},
          }

          for travel_date in dates:
              record = {"all_options": []}
              try:
                  result = get_flights(
                      flight_data=[FlightData(date=travel_date, from_airport="JED", to_airport="DTW")],
                      trip="one-way",
                      seat="economy",
                      passengers=Passengers(adults=1, children=0, infants_in_seat=0, infants_on_lap=0),
                      fetch_mode="fallback",
                      max_stops=2,
                  )
                  record["google_price_level"] = result.current_price
                  record["all_options"] = [dataclasses.asdict(f) for f in result.flights]
                  print(f"CASH_OK {travel_date} options={len(result.flights)}")
              except Exception as exc:
                  record["error"] = f"{type(exc).__name__}: {exc}"
                  print(f"CASH_ERROR {travel_date} {record['error'][:300]}")
              output["dates"][travel_date] = record
              time.sleep(1.0)

          output["completed_at_utc"] = dt.datetime.now(dt.timezone.utc).isoformat()
          Path("results/cash-google-flights.json").write_text(json.dumps(output, indent=2, ensure_ascii=False))
          PY

      - name: Upload search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jed-dtw-search-results
          path: results/*.json
          if-no-files-found: error
          retention-days: 1
