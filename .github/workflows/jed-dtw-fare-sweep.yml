name: Temporary JED-DTW fare sweep

on:
  push:
    branches:
      - tmp/jed-dtw-fares-20261012
    paths:
      - flightpoints_probe.py
      - .github/workflows/jed-dtw-fare-sweep.yml

permissions:
  contents: read

jobs:
  flightpoints-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MCP client
        run: python -m pip install 'mcp==2.3.0'

      - name: List Flightpoints tools
        id: probe
        continue-on-error: true
        run: python flightpoints_probe.py

      - name: Ensure results directory exists
        if: always()
        run: mkdir -p results && printf '%s\n' "step_outcome=${{ steps.probe.outcome }}" > results/workflow_status.txt

      - name: Upload Flightpoints tool schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flightpoints-tools
          path: results/
          if-no-files-found: warn
          retention-days: 3
