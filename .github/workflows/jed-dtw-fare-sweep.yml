name: Temporary JED-DTW fare sweep

on:
  push:
    branches:
      - tmp/jed-dtw-fares-20261012
    paths:
      - flyingblue_probe.py
      - .github/workflows/jed-dtw-fare-sweep.yml

permissions:
  contents: read

jobs:
  flyingblue-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser package
        run: python -m pip install playwright
      - name: Probe AF and KLM reward searches
        id: probe
        continue-on-error: true
        run: xvfb-run -a python flyingblue_probe.py
      - name: Ensure results directory exists
        if: always()
        run: mkdir -p results && printf '%s\n' "step_outcome=${{ steps.probe.outcome }}" > results/workflow_status.txt
      - name: Upload Flying Blue probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyingblue-probe
          path: results/
          if-no-files-found: warn
          retention-days: 3
