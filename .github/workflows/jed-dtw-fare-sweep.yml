name: Temporary JED-DTW fare sweep

on:
  push:
    branches:
      - tmp/jed-dtw-fares-20261012
    paths:
      - seats_probe.py
      - .github/workflows/jed-dtw-fare-sweep.yml

permissions:
  contents: read

jobs:
  seats-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install requests

      - name: Probe Seats.aero sources independently
        id: probe
        continue-on-error: true
        run: python seats_probe.py

      - name: Ensure results directory exists
        if: always()
        run: mkdir -p results && printf '%s\n' "step_outcome=${{ steps.probe.outcome }}" > results/workflow_status.txt

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seats-aero-probe
          path: results/
          if-no-files-found: warn
          retention-days: 3
