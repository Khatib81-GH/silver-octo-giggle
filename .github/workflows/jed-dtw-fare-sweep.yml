name: Temporary JED-DTW fare sweep

on:
  push:
    branches:
      - tmp/jed-dtw-fares-20261012
    paths:
      - fare_sweep.py
      - fare_sweep_v2.py
      - .github/workflows/jed-dtw-fare-sweep.yml

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install search dependencies
        run: python -m pip install --upgrade pip fast-flights typing_extensions pycryptodome requests

      - name: Run independent cash and award batches
        id: sweep
        continue-on-error: true
        run: python fare_sweep_v2.py

      - name: Ensure results directory exists
        if: always()
        run: mkdir -p results && printf '%s\n' "step_outcome=${{ steps.sweep.outcome }}" > results/workflow_status.txt

      - name: Upload all successful and partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jed-dtw-fares-2026-12-25-to-2027-01-05
          path: results/
          if-no-files-found: warn
          retention-days: 3
