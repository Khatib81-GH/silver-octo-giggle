name: Temporary JED-DTW fare sweep

on:
  push:
    branches:
      - tmp/jed-dtw-fares-20261012
    paths:
      - cash_only_v2.py
      - cash_only.py
      - fare_sweep.py
      - fare_sweep_v2.py
      - .github/workflows/jed-dtw-fare-sweep.yml

permissions:
  contents: read

jobs:
  cash-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cash-search parser and dependencies
        run: python -m pip install --upgrade pip typing_extensions pycryptodome requests 'git+https://github.com/AWeirdDev/flights.git@dev'

      - name: Capture alliance-filtered cash options date by date
        id: sweep
        continue-on-error: true
        run: python cash_only_v2.py

      - name: Ensure results directory exists
        if: always()
        run: mkdir -p results && printf '%s\n' "step_outcome=${{ steps.sweep.outcome }}" > results/workflow_status.txt

      - name: Upload cash results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jed-dtw-cash-2026-12-25-to-2027-01-05
          path: results/
          if-no-files-found: warn
          retention-days: 3
