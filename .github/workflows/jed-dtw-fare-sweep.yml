name: Temporary JED-DTW fare sweep

on:
  push:
    branches:
      - tmp/jed-dtw-fares-20261012
    paths:
      - award_afd.py
      - .github/workflows/jed-dtw-fare-sweep.yml

permissions:
  contents: read

jobs:
  award-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install released MCP client
        run: python -m pip install --upgrade pip 'mcp==2.3.0'

      - name: Query Flying Blue and SkyMiles independently in two date batches
        id: sweep
        continue-on-error: true
        run: python award_afd.py

      - name: Ensure results directory exists
        if: always()
        run: mkdir -p results && printf '%s\n' "step_outcome=${{ steps.sweep.outcome }}" > results/workflow_status.txt

      - name: Upload award results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jed-dtw-awards-2026-12-25-to-2027-01-05
          path: results/
          if-no-files-found: warn
          retention-days: 3
