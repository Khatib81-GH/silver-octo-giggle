name: Temporary JED-DTW fare sweep

on:
  push:
    branches:
      - tmp/jed-dtw-fares-20261012
    paths:
      - roame_chunks.py
      - .github/workflows/jed-dtw-fare-sweep.yml

permissions:
  contents: read

jobs:
  roame-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright Python package
        run: python -m pip install playwright

      - name: Inspect client chunks for award-search API calls
        id: inspect
        continue-on-error: true
        run: xvfb-run -a python roame_chunks.py

      - name: Ensure results directory exists
        if: always()
        run: mkdir -p results && printf '%s\n' "step_outcome=${{ steps.inspect.outcome }}" > results/workflow_status.txt

      - name: Upload chunk analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roame-chunks
          path: results/
          if-no-files-found: warn
          retention-days: 3
