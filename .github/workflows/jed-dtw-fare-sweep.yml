name: Temporary JED-DTW fare sweep

on:
  push:
    branches:
      - tmp/jed-dtw-fares-20261012
    paths:
      - delta_sweep.py
      - .github/workflows/jed-dtw-fare-sweep.yml

permissions:
  contents: read

jobs:
  delta-award-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone proven Delta scraper
        run: git clone --depth 1 https://github.com/louie3697/points-pilot-jobs.git /tmp/points-pilot-jobs

      - name: Install browser scraper dependencies
        run: python -m pip install --upgrade pip 'nodriver==0.50.3' 'websockets>=14,<15' 'httpx[http2]>=0.27' 'tenacity>=8.3' 'python-dotenv>=1.0'

      - name: Run guest SkyMiles searches one date at a time
        id: sweep
        continue-on-error: true
        env:
          SCRAPER_MIN_DELAY_S: '6'
          SCRAPER_BLOCK_THRESHOLD: '1'
        run: xvfb-run -a python delta_sweep.py

      - name: Ensure results directory exists
        if: always()
        run: mkdir -p results && printf '%s\n' "step_outcome=${{ steps.sweep.outcome }}" > results/workflow_status.txt

      - name: Upload SkyMiles results and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jed-dtw-skymiles-2026-12-25-to-2027-01-05
          path: results/
          if-no-files-found: warn
          retention-days: 3
