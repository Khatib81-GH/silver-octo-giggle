name: Temporary Pointhound bundle probe
on:
  push:
    branches: [tmp/jed-dtw-fares-20261012]
    paths:
      - scripts/pointhound_bundle_probe.py
      - .github/workflows/pointhound-bundle-probe.yml
permissions:
  contents: write
concurrency:
  group: temporary-pointhound-bundle-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/pointhound_bundle_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pointhound-bundle-probe-results
          path: results/pointhound_bundle_probe/
          retention-days: 3
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/pointhound_bundle_probe/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'Store Pointhound bundle probe results'
            git push origin HEAD:tmp/jed-dtw-fares-20261012
          fi
